pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    - name: markdownlint
      glob: "*.{md,mdx}"
      run: npx markdownlint-cli2 --no-globs {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
    - name: forbid-trailers
      run: node scripts/forbid-trailers.mjs {1}

pre-push:
  piped: true
  jobs:
    - name: clean-tree
      run: |
        if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
          echo "pre-push runs npm run check on the working tree, and the tree differs from the last commit."
          echo "Commit, stash or gitignore these files, then push again:"
          git status --short --untracked-files=normal
          exit 1
        fi
    - name: check
      run: npm run check
