version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
    ignore:
      # @astrojs/check 0.9.12 accepts typescript ^5 || ^6 only, so TypeScript 7 fails npm ci with ERESOLVE.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # GitHub Actions supports only default-days.
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
