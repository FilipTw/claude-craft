version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release waits before Dependabot proposes it, so a bad publish has time to be pulled.
    cooldown:
      default-days: 5
      semver-major-days: 30
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # GitHub Actions supports only default-days.
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
